# THE GLOBAL CHECK-MODIFIER REGISTRY.
#
# A modifier declared here applies to every check whose `tags` intersect its `appliesTo`. That
# is the whole point: "you don't speak the language" is ONE row, not the same penalty copied
# into every social event, drifting in value between copies (08-DIVERSITY-SYSTEMS D1).
#
# `labelKey` is derived from the id, so there is nowhere to type prose here either.
#
# FIXTURE SET — eight rows chosen to exercise every step of the resolution pipeline
# (conflicts, non-stacking collapse, diminishing returns, both clamps), not a seed corpus.
# The 160-modifier corpus is Phase 2B, written against the content bible.

# ── condition: how you present ──────────────────────────────────────────────────────────
- id: dishevelled
  appliesTo: [social, haggle, deception, intimidate, authority]
  when: { resource: hygiene, lte: 3 }
  delta: -2
  sourceKind: condition
  priority: 20
  stacks: false

- id: exhausted
  appliesTo: [physical, endurance, mechanics, perception, navigate]
  when: { resource: energy, lte: 2 }
  delta: -2
  sourceKind: condition
  priority: 20
  stacks: false

# ── the language row. `Skills.languages` exists in state and NOTHING read it before this. ──
- id: no_shared_language
  appliesTo: [social, haggle, deception, intimidate, authority, language]
  when: { not: { language: local } }
  delta: -2
  sourceKind: skill
  priority: 40
  stacks: false

# ── heat: being wanted follows you ──────────────────────────────────────────────────────
- id: wanted_by_authorities
  appliesTo: [authority, bribery, documents, search]
  when: { flag: wanted }
  delta: -3
  sourceKind: flag
  priority: 60
  stacks: true

# ── the money pair, and the conflict between them ───────────────────────────────────────
# Carrying a lot of cash is what a search finds; concealing it is what stops the search
# finding it. They cannot both apply, so they conflict and concealment wins on priority.
- id: large_cash_on_person
  appliesTo: [authority, search, bribery]
  when: { resource: money, gte: 400 }
  delta: -2
  sourceKind: condition
  conflictsWith: [cash_concealed]
  priority: 50
  stacks: false

- id: cash_concealed
  appliesTo: [authority, search]
  when: { item: cash_belt, gte: 1 }
  delta: 2
  sourceKind: item
  priority: 70
  stacks: false

# ── place, using the locationType predicate kind added alongside the registry ───────────
- id: official_scrutiny
  appliesTo: [authority, documents, deception]
  when: { locationType: [border_crossing, checkpoint] }
  delta: -1
  sourceKind: context
  priority: 30
  stacks: true

# ── a positive the player earns ─────────────────────────────────────────────────────────
- id: guard_owes_you
  appliesTo: [social, authority, bribery]
  when: { relationship: border_guard, gte: 1 }
  delta: 2
  sourceKind: relationship
  priority: 55
  stacks: true
