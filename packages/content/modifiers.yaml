# THE GLOBAL CHECK-MODIFIER REGISTRY.
#
# A modifier declared here applies to every check whose `tags` intersect its `appliesTo`. That
# is the whole point: "you don't speak the language" is ONE row, not the same penalty copied
# into every social event, drifting in value between copies (08-DIVERSITY-SYSTEMS D1).
#
# `labelKey` is derived from the id, so there is nowhere to type prose here either.
#
# ── READ THIS BEFORE ADDING A ROW ───────────────────────────────────────────────────────
#
# 1. `stacks` DEFAULTS TO FALSE, and every non-stacking row sharing a `sourceKind` collapses to
#    exactly ONE survivor per check — the largest |delta|, ties by id ascending. Priority does
#    not decide that; it decides `conflictsWith` only. So breadth for "3-7 modifiers on a
#    check" comes from across the twelve sourceKinds, NOT from many rows within one. Rows in
#    one kind should be alternative gradations of one idea (`exhausted` vs `running_on_fumes`),
#    because two independent pressures in one kind will silently suppress each other.
#    Write `stacks:` explicitly every time.
#
# 2. Priority ladder in use: 20 presentation · 30 place · 40 language and skill · 45-55 money
#    and relationship · 60-65 heat and flags · 70 items and countermeasures. (80 is reserved
#    for the synthetic row a complication injects.)
#
# 3. Every flag a row reads must be WRITTEN by a corpus event — `FLAG_READ_NEVER_WRITTEN` is an
#    error. Every npc/item/trait must be declared. That is what sizes this file.
#
# `region` and `companion` are the two thin kinds, and honestly so: `RunState` has no current
# region and no companion field. Region rows encode the player's PAPERS relative to a crossing,
# never a place's character (CLAUDE.md §11); companion rows key on flags content sets today and
# a preparation screen will set in Phase 3.

