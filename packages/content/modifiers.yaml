# ════════════════════════════════════════════════════════════════════════════════════════
# region — PAPERS RELATIVE TO A CROSSING, never a place's character (CLAUDE.md §11).
#
# `RunState` has no current region and the `visa` predicate needs a literal region id, so a
# global row cannot ask "do you have a visa for where you are". `transit_zone` is an ABSTRACT
# region the corpus grants visas for — it names no real place, and a row here reads the
# player's paperwork rather than anything about a location.
# ════════════════════════════════════════════════════════════════════════════════════════

- id: transit_visa_valid
  appliesTo: [documents, authority]
  when: { visa: transit_zone }
  delta: 2
  sourceKind: region
  priority: 63
  stacks: false

- id: transit_visa_expired
  appliesTo: [documents, authority, bribery]
  when: { visa: transit_zone, valid: false }
  delta: -2
  sourceKind: region
  priority: 63
  stacks: false

- id: no_transit_visa
  appliesTo: [documents, authority, bribery, search]
  when: { not: { visa: transit_zone } }
  delta: -2
  sourceKind: region
  priority: 63
  stacks: false

- id: papers_match_the_route
  appliesTo: [documents, authority]
  when: { all: [{ visa: transit_zone }, { passport: { valid: true } }] }
  delta: 1
  sourceKind: region
  priority: 63
  stacks: false

