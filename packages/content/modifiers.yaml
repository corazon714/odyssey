# ── the money pair, and the conflict between them ───────────────────────────────────────
# Carrying a lot of cash is what a search finds; concealing it is what stops the search
# finding it. They cannot both apply, so they conflict and concealment wins on priority.
- id: large_cash_on_person
  appliesTo: [authority, search, bribery]
  when: { resource: cash, gte: 400 }
  delta: -2
  sourceKind: condition
  conflictsWith: [cash_concealed]
  priority: 50
  stacks: false

- id: flush_with_cash
  appliesTo: [haggle, bribery, social]
  when: { resource: cash, gte: 200 }
  delta: 1
  sourceKind: condition
  priority: 45
  stacks: false

- id: pockets_empty
  appliesTo: [haggle, bribery, luck]
  when: { resource: cash, lte: 5 }
  delta: -2
  sourceKind: condition
  priority: 45
  stacks: false

# The three-tier money model, made visible to a check. Cash is stealable and VISIBLE; bank is
# neither. Someone who has moved their money into an account looks broke to a guard, which is
# the mechanical point of the distinction — without a row like this, `bank` would be a resource
# nothing ever reads.
- id: looks_broke
  appliesTo: [authority, search, bribery]
  when: { all: [{ resource: cash, lte: 20 }, { resource: bank, gte: 200 }] }
  delta: 1
  sourceKind: condition
  priority: 45
  stacks: false

- id: bank_backed
  appliesTo: [haggle, social]
  when: { resource: bank, gte: 500 }
  delta: 1
  sourceKind: condition
  priority: 45
  stacks: false

# The other side of it: a bribe you cannot fund.
- id: cannot_cover_a_bribe
  appliesTo: [bribery]
  when: { resource: cash, lte: 10 }
  delta: -3
  sourceKind: condition
  priority: 65
  stacks: true

