# THE COMPLICATION REGISTRY.
#
# A row layers onto an already-selected event: one extra sentence, a shift in difficulty, and
# usually a different set of things to do. Thirteen events crossed with twenty-five
# complications are three hundred situations for the price of authoring twenty-five rows
# (08-DIVERSITY-SYSTEMS D2). At most one attaches per event.
#
# `textKey` derives as `complication.<id>.text` and is a SEPARATE SENTENCE APPENDED to the body,
# never interpolated into it — a clause spliced into someone else's sentence cannot be made to
# agree grammatically across four languages, and the body's translator cannot see what will be
# put inside it.
#
# `checkDelta`, not `dcDelta`. It enters the modifier pipeline as a synthetic `context` row, so
# it is conflict-resolved, collapsed, diminished, CLAMPED and rendered as a chip. Sign follows
# the roll: harder is NEGATIVE. Zero is rejected.
#
# THE RULE THE SCHEMA ENFORCES: a row must add or remove a choice. A complication that only
# shifts a number is a modifier wearing a sentence, and it belongs in `modifiers.yaml` — which
# applies by check tag and costs nothing per event.
#
# Selection is CURSOR-FREE, so adding a row here shifts no other event's complication and no
# golden digest can move because one was drawn. `ATTACH_PERCENT` is the single tunable for how
# often one attaches at all; the sim reports the measured rate against it.

# ── queues, waiting, and running out of time ────────────────────────────────────────────
- id: queue_is_enormous
  appliesTo: [cat:border, authority, documents]
  weight: 3
  checkDelta: -1
  removesChoice: make_yourself_useful
  addsChoice:
    id: buy_a_place_in_line
    hiddenUnless: { resource: cash, gte: 20 }
    costs:
      - { op: resource, key: cash, delta: -20 }
    outcomes:
      - id: bought_forward
        weight: 1
        effects:
          - { op: advanceTime, hours: 1 }
          - { op: resource, key: heat, delta: 1 }

- id: shift_change
  appliesTo: [cat:border, cat:authority, authority]
  weight: 2
  checkDelta: -2
  # Whoever you had started to get somewhere with has gone home.
  removesChoice: make_yourself_useful
  addsChoice:
    id: start_again_with_the_new_one
    outcomes:
      - id: from_the_top
        weight: 1
        effects:
          - { op: advanceTime, hours: 2 }
          - { op: resource, key: morale, delta: -1 }

- id: you_are_running_late
  appliesTo: [cat:transit, cat:border, transit, road]
  weight: 2
  checkDelta: -2
  addsChoice:
    id: abandon_this_and_run
    outcomes:
      - id: made_it_just
        weight: 2
        effects:
          - { op: resource, key: energy, delta: -2 }
          - { op: resource, key: heat, delta: 1 }
      - id: missed_it_anyway
        weight: 1
        effects:
          - { op: resource, key: energy, delta: -2 }
          - { op: resource, key: morale, delta: -2 }
          - { op: advanceTime, hours: 4 }

# ── being watched ───────────────────────────────────────────────────────────────────────
- id: second_officer_watching
  appliesTo: [cat:border, cat:authority, authority, corruption]
  weight: 3
  checkDelta: -3
  # The whole point: every bribery row in the registry becomes unreachable here.
  removesChoice: offer_something
  addsChoice:
    id: keep_it_strictly_correct
    outcomes:
      - id: by_the_book
        weight: 1
        effects:
          - { op: advanceTime, hours: 3 }
          - { op: resource, key: heat, delta: -1 }

- id: a_crowd_has_gathered
  appliesTo: [cat:city, cat:transit, city, social, transit]
  weight: 2
  checkDelta: -1
  addsChoice:
    id: use_the_crowd
    check:
      skill: stealth
      dc: 11
      tags: [stealth, crime, perception]
    outcomes:
      - id: gone_in_the_press
        weight: 3
        onCheck: success
        effects:
          - { op: resource, key: heat, delta: -1 }
      - id: jostled_and_noticed
        weight: 2
        onCheck: failure
        effects:
          - { op: flag, id: made_a_scene }
          - { op: resource, key: cash, delta: -20 }

- id: a_second_vehicle_pulls_in
  appliesTo: [cat:crime, cat:road, crime, road, risk]
  weight: 2
  checkDelta: -2
  removesChoice: put_it_somewhere_they_will_not_look
  addsChoice:
    id: wait_for_them_to_leave
    outcomes:
      - id: outlasted_them
        weight: 1
        effects:
          - { op: advanceTime, hours: 2 }
          - { op: resource, key: energy, delta: -1 }

- id: the_radio_is_describing_you
  appliesTo: [cat:authority, cat:border, authority, risk]
  requires: { flag: wanted }
  weight: 4
  checkDelta: -3
  addsChoice:
    id: cover_your_face
    check:
      skill: stealth
      dc: 12
      tags: [stealth, crime, deception]
    outcomes:
      - id: not_the_one_they_want
        weight: 3
        onCheck: success
        effects:
          - { op: resource, key: heat, delta: -1 }
      - id: exactly_the_one
        weight: 3
        onCheck: failure
        effects:
          - { op: resource, key: heat, delta: 3 }
          - { op: flag, id: made_a_scene }

