id: border.bribe_attempt
category: border
tags:
  - authority
  - money
  - risk
  - corruption
priority: beat
beatType: border_crossing
tensionBand:
  - 0.4
  - 1
context:
  locationTypes:
    - border_crossing
    - checkpoint
  timeOfDay:
    - evening
    - night
  transportModes:
    - car
    - truck
    - bus
cooldownLegs: 999
maxOccurrences: 1
exclusiveGroup: border_resolution
image: border/bribe_attempt
requires:
  all:
    - resource: money
      gte: 30
    - not:
        flag: bribed_this_border
choices:
  - id: offer_bribe
    labelKey: events.border.bribe_attempt.choice.offer
    costs:
      - op: resource
        key: money
        delta: -40
    check:
      skill: negotiation
      dc: 12
      modifiers:
        - labelKey: check.modifier.smooth_talker
          delta: 2
          when:
            trait: smooth_talker
          why: 'fixture: exercises the choice-local modifier path before the registry exists'
        - labelKey: check.modifier.unwashed
          delta: -2
          when:
            resource: hygiene
            lte: 3
          why: 'fixture: exercises the choice-local modifier path before the registry exists'
        - labelKey: check.modifier.wanted
          delta: -3
          when:
            flag: wanted
          why: 'fixture: exercises the choice-local modifier path before the registry exists'
    outcomes:
      - id: success
        weight: 1
        onCheck: success
        effects:
          - op: flag
            id: bribed_this_border
            ttlLegs: 1
          - op: relationship
            npc: border_guard
            trustDelta: 1
            meet: true
            addTags:
              - bribed
          - op: advanceTime
            hours: 1
          - op: scheduleEvent
            eventId: border.guard_remembers
            inLegs:
              - 4
              - 12
      - id: refused
        weight: 3
        onCheck: failure
        effects:
          - op: resource
            key: heat
            delta: 2
          - op: flag
            id: bribe_on_record
      - id: detained
        weight: 1
        onCheck: failure
        requires:
          resource: heat
          gte: 5
        effects:
          - op: flag
            id: detained
          - op: advanceTime
            hours: 14
          - op: resource
            key: morale
            delta: -3
  - id: present_documents
    labelKey: events.border.bribe_attempt.choice.documents
    requires:
      passport:
        present: true
        valid: true
    outcomes:
      - id: waved_through
        weight: 4
        effects:
          - op: advanceTime
            hours: 2
      - id: flagged_in_system
        weight: 1
        requires:
          flag: wanted
        effects:
          - op: flag
            id: detained
          - op: unlockEnding
            id: ending.detained_at_border
  - id: turn_back
    hiddenUnless:
      resource: heat
      gte: 6
    outcomes:
      - id: detour
        weight: 1
        effects:
          - op: advanceTime
            hours: 20
          - op: resource
            key: morale
            delta: -2
          - op: flag
            id: took_the_long_way
